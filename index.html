<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Sorting</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f4efe6;color:#333}
  .screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box}
  .screen.active{display:flex}
  h1,h2{margin:0 0 10px}
  button{font:inherit;padding:10px 24px;border:none;border-radius:8px;background:#5b4636;color:#fff;cursor:pointer;min-width:200px}
  button:hover{opacity:.85}
  button:disabled{background:#aaa;cursor:not-allowed}

  /* stage select: square tiles, left to right, top to bottom */
  #grid{display:grid;grid-template-columns:repeat(3,140px);gap:16px}
  @media(max-width:500px){#grid{grid-template-columns:repeat(2,140px)}}
  .tile{width:140px;height:140px;min-width:0;padding:10px;border-radius:20px;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .tile b{font-size:1.05rem}
  .tile small{font-size:.8rem;opacity:.85}

  #topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
  #topbar span{margin-right:16px;font-weight:bold}
  #topbar button{min-width:auto;padding:8px 16px;margin-left:6px}

  /* instruction text above the shelf */
  #guide{max-width:640px;text-align:center;min-height:48px;margin:0;line-height:1.5}
  #guide.panel{background:#fff;border:2px solid #5b4636;border-radius:10px;padding:12px 16px;text-align:left}
  .warn{color:#b3261e;font-weight:bold}

  /* bookcase: wooden frame + back panel with planks; the thick bottom border is the shelf plank */
  #shelf{position:relative;box-sizing:border-box;width:min(700px,95vw);height:282px;
         border:14px solid #8a5a2b;border-bottom:18px solid #5f3a17;border-radius:6px 6px 2px 2px;
         background:repeating-linear-gradient(90deg,#6b4423 0 62px,#52331a 62px 64px);
         box-shadow:inset 0 14px 18px #0008,inset 12px 0 16px #0006,inset -12px 0 16px #0006,0 8px 12px #0005}
  #shelf.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  /* book look = cover colour + spine + title lines. book SIZE = book type, never the number */
  .book{--c:#4a78b0;position:absolute;bottom:0;box-sizing:border-box;border:1px solid rgba(0,0,0,.5);
        border-radius:2px 3px 2px 2px;
        background:
          linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.22) 28%,rgba(0,0,0,0) 55%,rgba(0,0,0,.3)),   /* rounded spine shading */
          linear-gradient(#0000 30px,#e8c766 30px 34px,#0000 34px 38px,#e8c766 38px 42px,#0000 42px),          /* gold bands (top) */
          linear-gradient(#0000 calc(100% - 22px),#e8c766 calc(100% - 22px) calc(100% - 18px),#0000 calc(100% - 18px) calc(100% - 14px),#e8c766 calc(100% - 14px) calc(100% - 10px),#0000 calc(100% - 10px)),  /* gold bands (bottom) */
          var(--c);
        box-shadow:2px 0 4px #0006;transition:left .4s,transform .2s,opacity .2s}
  /* title label on the spine */
  .book::before{content:'';position:absolute;left:18%;right:18%;top:50%;height:22%;border:1px solid #c9a24a;border-radius:2px;
        background:linear-gradient(#0000 22%,#5a4a3a99 22% 32%,#0000 32% 50%,#5a4a3a66 50% 58%,#0000 58%),#f3e6c4}
  .t2,.t3{border-width:2px}   /* hardcovers have a thicker cover edge */
  .c0{--c:#b5524a}.c1{--c:#4a78b0}.c2{--c:#7a5aa0}.c3{--c:#3f9aa8}.c4{--c:#8a5a3c}.c5{--c:#3c4f7a}.c6{--c:#a04a7c}
  /* number tab, top-left of the book */
  .tab{position:absolute;top:4px;left:3px;z-index:1;background:#fffbe8;color:#333;font-weight:bold;line-height:1;
       padding:2px 3px;border-radius:2px 2px 2px 0;border:1px solid #0006;box-shadow:1px 1px 2px #0004}
  .book.key{transform:translateY(-14px);outline:3px solid #ffc247;outline-offset:2px;animation:blinkEdge 1s infinite}
  @keyframes blinkEdge{
    0%,100%{outline-color:#ffc247;box-shadow:0 0 12px 4px #ffc247}
    50%{outline-color:#ffc24722;box-shadow:0 0 0 0 #ffc24700}}
  .book.dim{opacity:.5}
  .book.done{--c:#5aa469}

  /* clickable dashed lines between books (Insertion Sort: insert here) */
  .gap{position:absolute;top:0;bottom:0;width:28px;z-index:2;cursor:pointer}
  .gap::before{content:'';position:absolute;left:12px;top:0;bottom:0;border-left:3px dashed #ffc247}
  .gap:hover{background:#e0a03066}

  /* action buttons under the shelf */
  #controls{display:flex;gap:10px;min-height:46px;align-items:center;justify-content:center;flex-wrap:wrap}
  #controls button{min-width:120px}

  /* tutorial: glow on the one thing you must click */
  button.need{box-shadow:0 0 0 4px #e0a030;animation:blink 1s infinite}
  @keyframes blink{50%{box-shadow:0 0 0 4px #e0a03000}}
  .gap.need{background:#e0a03088;animation:blink2 1s infinite}
  @keyframes blink2{50%{background:#e0a03010}}

  #overlay{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  #overlay.show{display:flex}
  #box{background:#fff;border-radius:12px;padding:24px;max-width:460px;width:100%;text-align:center;line-height:1.5}
  #box ul{text-align:left}
  #box .btns{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px}
</style>
</head>
<body>

<!-- START SCREEN -->
<div id="start" class="screen active">
  <h1>Library Sorting</h1>
  <button onclick="show('select')">Start</button>
  <button onclick="exitGame()">Exit</button>
</div>

<!-- STAGE SELECT (tiles are created by refreshSelect) -->
<div id="select" class="screen">
  <h2>Select Stage</h2>
  <div id="grid"></div>
  <button onclick="show('start')">Back</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div id="topbar">
    <div><span id="tries"></span><span id="time"></span></div>
    <div>
      <button id="hintBtn" onclick="openHint()">Hint</button>
      <button onclick="openMenu()">Menu</button>
    </div>
  </div>
  <p id="guide"></p>
  <div id="shelf"></div>
  <div id="controls"></div>
</div>

<!-- SHOWN IF THE BROWSER BLOCKS window.close() -->
<div id="bye" class="screen">
  <h2>Thanks for playing!</h2>
  <p>You can close this tab now.</p>
</div>

<!-- POPUP -->
<div id="overlay"><div id="box"></div></div>

<script>
/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const isSorted = a => a.every((v, i) => i === 0 || a[i - 1] <= v);
function randUnique(n) {                 // unique values so every answer is clear
  const s = new Set();
  while (s.size < n) s.add(rand(10, 99));
  return [...s];
}
let nextId = 0;                          // every book gets its own id
/* Book types: the SIZE of a book comes from its type, never from its number.
   Only the number on the tab matters for sorting. */
const BOOK_TYPES = [
  { name: 'Pocket book',     h: 110, w: 0.70 },
  { name: 'Paperback',       h: 150, w: 0.80 },
  { name: 'Hardcover',       h: 190, w: 0.90 },
  { name: 'Large hardcover', h: 225, w: 1.00 },
];
function mkBooks(vals) {
  const types = vals.map((_, i) => i % BOOK_TYPES.length);      // a mix of all types
  types.sort(() => Math.random() - 0.5);                         // shuffled: not related to the numbers
  return vals.map((v, i) => ({ id: nextId++, v, t: types[i], c: rand(0, 6) }));
}
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* =========================================================
   THE MOVES THE PLAYER CAN CHOOSE
     'swap'  : two neighbour books exchange places      (Bubble Sort)
     'stay'  : nothing moves, already in place          (all stages)
     number  : the dashed line you clicked              (Insertion Sort)
   =========================================================
   SORTING ALGORITHMS -> "TRACE"
   Each function runs the basic textbook algorithm on the books and records
   every decision as a step:
     type   : 'bubble' | 'insert'
     lo, hi : the active range
     key    : index of the highlighted book (bubble: left book of the pair)
     answer : 'swap', 'stay', or an index (see above)
     after  : the shelf order after this step
   During play, every action is compared with step.answer.
   ========================================================= */

/* ---------- BUBBLE SORT ----------
   for each pass: compare neighbours a[j] and a[j+1], swap if left > right.
   After each pass the biggest book of the range is at the right end.
   Best/Worst/Average: O(n²). */
function buildBubbleTrace(input) {
  const a = [...input], steps = [], n = a.length;
  for (let pass = 0; pass < n - 1; pass++) {
    for (let j = 0; j < n - 1 - pass; j++) {
      const doSwap = a[j].v > a[j + 1].v;
      if (doSwap) [a[j], a[j + 1]] = [a[j + 1], a[j]];
      steps.push({ type: 'bubble', lo: 0, hi: n - 1 - pass, key: j,
                   answer: doSwap ? 'swap' : 'stay', after: [...a] });
    }
  }
  return steps;
}

/* ---------- INSERTION SORT ----------
   The left part a[0..i-1] is always sorted.
   Take key = a[i], shift every book bigger than key one slot right,
   then drop key into the gap.
   Best O(n) (nearly sorted), Worst O(n²). */
function buildInsertionTrace(input) {
  const a = [...input], steps = [];
  for (let i = 1; i < a.length; i++) {
    const key = a[i];
    let j = i - 1;
    while (j >= 0 && a[j].v > key.v) {   // shift bigger books to the right
      a[j + 1] = a[j];
      j--;
    }
    a[j + 1] = key;                       // insert key into the gap
    steps.push({ type: 'insert', lo: 0, hi: i, key: i,
                 answer: j + 1 === i ? 'stay' : j + 1, after: [...a] });
  }
  return steps;
}

/* ---------- TUTORIAL (hardcoded, every step is forced) ----------
   Part 1 Bubble    start 30 20 40 10 : Swap, Stay, Swap
   Part 2 Insertion start 20 40 10 30 50 : Stay, Insert, Insert
   A step with "start" gives the player a fresh shelf. */
const TUTORIAL = [
  /* ----- PART 1: BUBBLE ----- */
  { type: 'bubble', key: 0, answer: 'swap', start: [30, 20, 40, 10],
    intro: `<b>Part 1 · Bubble Sort — step 1 of 3 · SWAP</b><br>
      Bubble Sort compares <b>two neighbours</b> at a time. The two <b>highlighted</b> books (blinking edge),
      <b>30</b> and <b>20</b>, are being compared. Read the <b>number tab</b> at the top-left of each book; the size of a book does not matter.
      The bigger number (30) is on the left,
      so they are in the wrong order.<br>
      Press the glowing <b>Swap</b> button.`,
    result: `<b>Swap = the two neighbours exchange places.</b><br>
      20 is now left of 30. Only these two books moved.` },

  { type: 'bubble', key: 1, answer: 'stay',
    intro: `<b>Part 1 · Bubble Sort — step 2 of 3 · STAY</b><br>
      Next pair: <b>30</b> and <b>40</b>. The smaller book is already on the left,
      so this pair is in the right order.<br>
      Press the glowing <b>Stay</b> button.`,
    result: `<b>Stay = nothing moves.</b><br>
      The pair was already in order, so we leave it and look at the next pair.` },

  { type: 'bubble', key: 2, answer: 'swap',
    intro: `<b>Part 1 · Bubble Sort — step 3 of 3 · SWAP</b><br>
      Next pair: <b>40</b> and <b>10</b>. 40 is bigger and on the left, so swap them.<br>
      Press the glowing <b>Swap</b> button.`,
    result: `The biggest book, <b>40</b>, "bubbled" all the way to the right end. That was one full pass.<br>
      In the real stage you repeat passes until every book is in place.` },

  /* ----- PART 2: INSERTION ----- */
  { type: 'insert', key: 1, answer: 'stay', start: [20, 40, 10, 30, 50],
    intro: `<b>Part 2 · Insertion Sort — step 1 of 3 · STAY</b><br>
      Insertion Sort grows a <b>sorted part</b> on the left. The raised book with the blinking edge is the <b>key</b> (40).
      The only book on its left is 20, a sorted part by itself. Faded books are not used yet.<br>
      40 is bigger than 20, so it already belongs here. Press the glowing <b>Stay</b> button.`,
    result: `The sorted part grew by one book: <b>20 40</b>.` },

  { type: 'insert', key: 2, answer: 0,
    intro: `<b>Part 2 · Insertion Sort — step 2 of 3 · INSERT</b><br>
      The key is now <b>10</b>. The sorted books on its left are 20 and 40.
      10 is smaller than both, so it must go to the very <b>front</b>.<br>
      Click the glowing <b>dashed line</b> before 20.`,
    result: `<b>Insert = take the key and drop it into a gap.</b><br>
      20 and 40 slid one place to the right to make room.
      Swap only exchanges two books, Insert shifts every book in between.` },

  { type: 'insert', key: 3, answer: 2,
    intro: `<b>Part 2 · Insertion Sort — step 3 of 3 · INSERT</b><br>
      The key is <b>30</b>. The sorted books on its left are 10, 20, 40.
      30 is bigger than 20 but smaller than 40, so it goes <b>between 20 and 40</b>.<br>
      Click the glowing <b>dashed line</b> between 20 and 40.`,
    result: `40 slid right to make room. All books are sorted, and you know every move!` },
];

function buildTutorialSteps() {
  let a = [], steps = [];
  TUTORIAL.forEach(t => {
    const s = { ...t };
    if (t.start) { a = mkBooks(t.start); s.before = [...a]; }      // fresh shelf for a new part
    const n = a.length;
    s.lo = 0;
    s.hi = t.type === 'insert' ? t.key : n - 1;
    if (t.answer === 'swap') [a[t.key], a[t.key + 1]] = [a[t.key + 1], a[t.key]];
    else if (t.type === 'insert' && typeof t.answer === 'number') { const [k] = a.splice(t.key, 1); a.splice(t.answer, 0, k); }
    s.after = [...a];
    steps.push(s);
  });
  return steps;
}

/* ================= STAGES ================= */
const STAGES = [
  { name: 'Tutorial', tutorial: true, build: buildTutorialSteps },

  { name: 'Bubble Sort', size: 5, build: buildBubbleTrace,
    hint: `<h3>Bubble Sort</h3>
      <p>Two neighbour books have a blinking edge. Compare the numbers on their tabs (not the book sizes).</p>
      <p><b>Left book bigger</b> → press <b>Swap</b>.<br>
      <b>Otherwise</b> → press <b>Stay</b>.</p>
      <p>After each pass the biggest book of the range reaches the right end and turns green.</p>` },

  { name: 'Insertion Sort', size: 7, build: buildInsertionTrace,
    hint: `<h3>Insertion Sort</h3>
      <p>The left part is always sorted. The raised book with the blinking edge is the <b>key</b>. Compare the numbers on the tabs, not the book sizes.</p>
      <p>Find the gap in the sorted part where the key fits and click that dashed line.
      Books it passes slide one step right.</p>
      <p>If the key is already bigger than everything on its left, press <b>Stay</b>.</p>` },
];

const TUTORIAL_INTRO = `<h3>How to play</h3>
  <p>Sort the books from smallest to biggest, one step at a time, like a sorting algorithm does.
  You will learn 2 methods: <b>Bubble</b> and <b>Insertion</b> sort.</p>
  <p>The moves you can choose:</p>
  <ul>
    <li><b>Swap</b>: two neighbour books exchange places.</li>
    <li><b>Insert</b>: click a dashed line to drop the highlighted book into that gap.</li>
    <li><b>Stay</b>: nothing moves because it is already right.</li>
  </ul>
  <p>Books come in different sizes (pocket, paperback, hardcover...). <b>Size does not matter</b>: only the number on the tab at the top-left of each book.</p>
  <p>The book with the <b>blinking edge</b> is the one being worked on. <b>Green</b> books are sorted.</p>
  <p>This tutorial is guided: do exactly what each step says. You can't lose here.</p>`;

const MAX_TRIES = 3;
let G = null;                                            // current game
let unlocked = +load('ls4_unlocked') || 1;               // highest stage you may play
const best = STAGES.map((_, k) => +load('ls4_best' + k) || 0);

/* ================= NAVIGATION ================= */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if (id === 'select') refreshSelect();
}
function refreshSelect() {
  $('#grid').innerHTML = '';
  STAGES.forEach((st, k) => {
    const locked = k > unlocked;
    const info = k === 0 ? '' : locked ? 'Locked' : (best[k] ? 'Best: ' + best[k] : '');
    const b = document.createElement('button');
    b.className = 'tile';
    b.disabled = locked;
    b.innerHTML = `<b>${k === 0 ? 'Tutorial' : 'Stage ' + k}</b><small>${k === 0 ? 'How to play' : st.name}</small><small>${info}</small>`;
    b.onclick = () => startStage(k);
    $('#grid').appendChild(b);
  });
}
function exitGame() {
  window.close();                 // only works if the tab was opened by script
  show('bye');                    // fallback screen
}

/* ================= POPUP ================= */
function popup(html, buttons) {
  $('#box').innerHTML = html + '<div class="btns"></div>';
  buttons.forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { $('#overlay').classList.remove('show'); fn(); };
    $('#box .btns').appendChild(b);
  });
  $('#overlay').classList.add('show');
}
const popupOpen = () => $('#overlay').classList.contains('show');

/* ================= TIMER ================= */
function pauseTimer()  { if (G && G.startedAt) { G.elapsed += Date.now() - G.startedAt; G.startedAt = null; } }
function resumeTimer() { if (G) G.startedAt = Date.now(); }
function seconds() {
  return Math.floor((G.elapsed + (G.startedAt ? Date.now() - G.startedAt : 0)) / 1000);
}
setInterval(() => {
  if (G) $('#time').textContent = G.tutorial ? '' : 'Time: ' + seconds() + 's';
}, 250);

/* ================= GAME ================= */
function startStage(k) {
  const st = STAGES[k];
  let steps, arr;
  if (st.tutorial) {
    steps = st.build();
    arr = steps[0].before;
  } else {
    let vals;
    do { vals = randUnique(st.size); } while (isSorted(vals));
    arr = mkBooks(vals);
    steps = st.build(arr);
  }
  G = { stage: k, tutorial: !!st.tutorial, arr, steps, step: 0,
        phase: 'ask',            // 'ask' = player must act, 'result' = tutorial explains the result
        tries: MAX_TRIES, mistakes: 0, hints: 0, elapsed: 0, startedAt: null, busy: false };
  $('#shelf').innerHTML = '';
  $('#hintBtn').style.display = G.tutorial ? 'none' : '';     // no hint in the tutorial
  $('#hintBtn').textContent = 'Hint (-100)';
  show('game');
  refresh();
  if (G.tutorial) popup(TUTORIAL_INTRO, [['Start Practice', resumeTimer]]);
  else resumeTimer();
}

/* redraw everything for the current step */
function refresh() {
  renderShelf(G.phase === 'ask' ? 'play' : 'move');
  renderGuide();
  renderControls();
}

/* mode: 'play' = show key + active range, 'move' = after the move, 'done' = all green */
function renderShelf(mode) {
  const shelf = $('#shelf'), n = G.arr.length, W = shelf.clientWidth;
  const slot = Math.min(80, Math.floor(W / n)), off = (W - slot * n) / 2;
  G.slot = slot; G.off = off;
  const st = G.steps[G.step];
  G.arr.forEach((b, i) => {
    let el = document.getElementById('b' + b.id);
    const T = BOOK_TYPES[b.t];
    if (!el) {
      el = document.createElement('div');
      el.id = 'b' + b.id;
      el.title = T.name;
      const tab = document.createElement('div');       // number tab, top-left
      tab.className = 'tab';
      tab.textContent = b.v;
      el.appendChild(tab);
      shelf.appendChild(el);
    }
    const w = Math.round((slot - 6) * T.w);            // narrower for small book types
    el.style.left = (off + i * slot + 3 + Math.round((slot - 6 - w) / 2)) + 'px';
    el.style.width = w + 'px';
    el.style.height = T.h + 'px';
    el.firstChild.style.fontSize = Math.max(11, Math.min(15, Math.round(slot * 0.2))) + 'px';
    let cls = 'book c' + b.c + ' t' + b.t;
    if (mode === 'done') cls += ' done';
    else if (st) {
      if (st.type === 'bubble') {
        if (i > st.hi) cls += ' done';                              // already in final place
        else if (mode === 'play' && (i === st.key || i === st.key + 1)) cls += ' key';
      } else if (mode === 'play') {                                 // insertion
        if (i === st.key) cls += ' key';
        else if (i < st.lo || i > st.hi) cls += ' dim';
      }
    }
    el.className = cls;
  });
  $('#tries').textContent = G.tutorial
    ? 'Tutorial: step ' + Math.min(G.step + 1, G.steps.length) + ' of ' + G.steps.length
    : 'Tries left: ' + G.tries;
}

/* text above the shelf */
function renderGuide(warning) {
  const g = $('#guide'), st = G.steps[G.step];
  g.className = G.tutorial ? 'panel' : '';
  if (!st) { g.innerHTML = ''; return; }
  if (G.tutorial) {
    g.innerHTML = (G.phase === 'ask' ? st.intro : st.result) + (warning ? `<br><span class="warn">${warning}</span>` : '');
    return;
  }
  const k = G.arr[st.key].v;
  if (st.type === 'bubble') {
    g.innerHTML = `Compare <b>${k}</b> and <b>${G.arr[st.key + 1].v}</b>. Swap them or Stay?`;
  } else {
    g.innerHTML = `Key <b>${k}</b>: click the dashed line where it belongs, or press Stay if it is already in place.`;
  }
}

/* buttons + dashed lines for the current step */
function renderControls() {
  const shelf = $('#shelf'), box = $('#controls'), st = G.steps[G.step];
  shelf.querySelectorAll('.gap').forEach(g => g.remove());
  box.innerHTML = '';
  if (!st) return;

  // tutorial: after the move, the player reads the result and presses Next
  if (G.tutorial && G.phase === 'result') {
    const b = document.createElement('button');
    b.textContent = G.step === G.steps.length - 1 ? 'Finish' : 'Next';
    b.onclick = nextTutorialStep;
    box.appendChild(b);
    return;
  }

  const addButton = (label, act) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => doAction(act);
    if (G.tutorial && st.answer === act) b.classList.add('need');
    box.appendChild(b);
  };

  if (st.type === 'bubble') {
    addButton('Swap', 'swap');
    addButton('Stay', 'stay');
  } else {
    addButton('Stay', 'stay');
    for (let g = st.lo; g < st.key; g++) {          // every gap left of the key
      const el = document.createElement('div');
      el.className = 'gap';
      el.style.left = (G.off + g * G.slot + 3 - 14) + 'px';
      el.title = 'Insert here';
      el.onclick = () => doAction(g);
      if (G.tutorial && st.answer === g) el.classList.add('need');
      shelf.appendChild(el);
    }
  }
}

function describe(st) {
  if (st.answer === 'swap') return 'Swap';
  if (st.answer === 'stay') return 'Stay';
  return 'Insert at spot ' + (st.answer + 1);
}

function shake() {
  const sh = $('#shelf');
  sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
}

async function doAction(act) {
  if (!G || G.busy || popupOpen() || G.phase !== 'ask') return;
  const st = G.steps[G.step];

  if (G.tutorial) {
    if (act !== st.answer) {                        // tutorial is forced: only the shown move works
      shake();
      const need = st.answer === 'swap' ? 'press Swap' : st.answer === 'stay' ? 'press Stay'
                 : 'click the glowing dashed line';
      renderGuide('This step is guided. Please ' + need + '.');
      return;
    }
    G.arr = st.after;
    G.phase = 'result';
    refresh();
    return;
  }

  G.busy = true;
  if (act !== st.answer) {                         // wrong move = lose a try
    G.tries--; G.mistakes++;
    $('#tries').textContent = 'Tries left: ' + G.tries;
    $('#guide').innerHTML = `<span class="warn">Wrong!</span> The right move was: <b>${describe(st)}</b>`;
    shake();
    await sleep(1100);
  }
  G.arr = st.after;                                // always show the correct move
  renderShelf('move');
  renderControls();
  await sleep(550);

  if (G.tries <= 0) return fail();
  G.step++;
  if (G.step >= G.steps.length) {
    renderShelf('done');
    renderGuide();
    renderControls();
    await sleep(500);
    return win();
  }
  G.busy = false;
  refresh();
}

/* tutorial only: go to the next scripted step */
async function nextTutorialStep() {
  if (popupOpen()) return;
  G.step++;
  G.phase = 'ask';
  if (G.step >= G.steps.length) {
    renderShelf('done');
    renderGuide();
    renderControls();
    await sleep(600);
    return win();
  }
  const next = G.steps[G.step];
  if (next.before) {                               // a new part starts with a fresh shelf
    G.arr = next.before;
    $('#shelf').innerHTML = '';
  }
  refresh();
}

/* ================= HINT & MENU ================= */
function openHint() {
  if (!G || G.busy || G.tutorial || popupOpen()) return;
  pauseTimer();
  G.hints++;
  popup(STAGES[G.stage].hint + '<p><small>Hint used: -100 score</small></p>', [['Got it', resumeTimer]]);
}
function openMenu() {
  if (!G || G.busy || popupOpen()) return;
  pauseTimer();
  const k = G.stage;
  popup('<h3>Paused</h3>', [
    ['Resume', resumeTimer],
    ['Retry', () => startStage(k)],
    ['Exit', () => { G = null; show('select'); }],
  ]);
}

/* ================= RESULT ================= */
function win() {
  pauseTimer();
  const k = G.stage;

  if (G.tutorial) {
    G = null;
    return popup(`<h2>Tutorial Complete!</h2>
      <p>You used every move: <b>Swap</b>, <b>Insert</b> and <b>Stay</b>.</p>
      <p>Stage 1 is <b>Bubble Sort</b> (Swap / Stay).<br>
      Stage 2 is <b>Insertion Sort</b> (Insert / Stay).</p>
      <p>From now on a wrong move costs 1 try.</p>`, [
      ['Play Stage 1', () => startStage(1)],
      ['Stage Select', () => show('select')],
    ]);
  }

  const secs = seconds();
  const score = Math.max(0, 1000 - 5 * secs - 150 * G.mistakes - 100 * G.hints);
  if (score > best[k]) { best[k] = score; save('ls4_best' + k, score); }
  if (k < STAGES.length - 1 && k + 1 > unlocked) { unlocked = k + 1; save('ls4_unlocked', unlocked); }

  const buttons = [];
  if (k < STAGES.length - 1) buttons.push(['Next Stage', () => startStage(k + 1)]);
  buttons.push(['Stage Select', () => show('select')]);
  popup(`<h2>Stage Clear!</h2>
    ${G.mistakes === 0 ? '<p><b>No blunder!</b></p>' : ''}
    <p>Time: ${secs}s<br>Mistakes: ${G.mistakes}<br>Hints: ${G.hints}</p>
    <h3>Score: ${score}</h3>`, buttons);
}
function fail() {
  pauseTimer();
  const k = G.stage;
  popup('<h2>Out of tries</h2>', [
    ['Retry', () => startStage(k)],
    ['Stage Select', () => show('select')],
  ]);
}

window.addEventListener('resize', () => {
  if (G && G.steps[G.step] && $('#game').classList.contains('active')) refresh();
});
</script>
